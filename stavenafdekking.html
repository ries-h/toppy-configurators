<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stel je stavenafdekking samen · Toppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://cdn.toppy.nl/frontend/typpo/typpo-heavy.css">
<style>html,body{margin:0;background:#fff;font-family:Poppins,Helvetica,Arial,system-ui,sans-serif;-webkit-text-size-adjust:100%}</style>
</head><body>
<!-- ============================================================
     Toppy configurator stavenafdekking: plakbaar HTML-blok
     Zelfde opzet als de hottub-configurator (Skøn). Twee manieren: dit blok in een
     HTML-blok op de website plakken, of als losse pagina hosten en in een
     iframe/modal laden (<div id="toppy-sc" data-pagina>).
     Aanvragen gaan naar JotForm 262934506309056 (Offerte aanvragen stavenafdekking).
     Rekenwijze gelijk aan de configurator /category/2735 (calculateM2):
       rond, achthoekig:               (A + 0,5)²
       ovaal, achthoekig lang, rechthoek: (A + 0,5) × (B + 0,5)
       met trap:                      (A + 0,9) × (B + C + 0,5)
       minimaal 20 m², × prijs per m², + € 150 productie- en verzendkosten.
     Handmatig aanpassen kan alleen in het blok "INSTELLINGEN".
     ============================================================ -->
<div id="toppy-sc" data-pagina></div>
<style>
#toppy-sc{--ink:#343e40;--ink2:#5f6768;--mute:#8b9091;--line:#e3e3e3;--soft:#f5f5f5;--y:#ffcb01;--y2:#fdd941;--g:#12ac74;--blue:#35acf8;--red:#f3575e;
  --head:Typpo,Poppins,Helvetica,Arial,system-ui,sans-serif;--r:.375rem;--r2:.625rem;--sh:0 7px 16px 0 rgba(0,0,0,.15);
  color:var(--ink);font-family:inherit;line-height:1.5;max-width:1080px;margin:0 auto;position:relative}
#toppy-sc *{box-sizing:border-box}
#toppy-sc button,#toppy-sc input,#toppy-sc textarea{font-family:inherit;color:inherit}
#toppy-sc .thc-test{background:#fff8d6;border:1px solid var(--y);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:10px}
#toppy-sc a{color:var(--blue)}

/* balk */
#toppy-sc .thc-bar{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:var(--r2) var(--r2) 0 0;padding:14px 22px}
#toppy-sc .thc-bar h1{font-family:var(--head);font-size:20px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em;min-width:0}
#toppy-sc .thc-bar h1 span{font-weight:500;color:var(--ink2)}
#toppy-sc .thc-bar .thc-vanaf{margin-left:auto;text-align:right;font-size:12px;color:var(--ink2);line-height:1.2}
#toppy-sc .thc-bar .thc-vanaf b{white-space:nowrap;display:block;font-family:var(--head);font-size:22px;font-weight:800;color:var(--ink)}

/* stappen */
#toppy-sc .thc-steps{display:flex;border:1px solid var(--line);border-top:0;background:#fff;overflow-x:auto;scrollbar-width:none}
#toppy-sc .thc-steps::-webkit-scrollbar{display:none}
#toppy-sc .thc-step{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:12px 16px;border:0;background:none;font-size:14px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
#toppy-sc .thc-step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink2)}
#toppy-sc .thc-step.is-done{color:var(--ink)}
#toppy-sc .thc-step.is-done i{background:var(--g);color:#fff}
#toppy-sc .thc-step.is-now{color:var(--ink);font-weight:700;border-bottom-color:var(--y)}
#toppy-sc .thc-step.is-now i{background:var(--y);color:var(--ink)}
#toppy-sc .thc-step[disabled]{cursor:default}

/* hoofdvlak */
#toppy-sc .thc-main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border:1px solid var(--line);border-top:0;background:#fff}
@media (max-width:900px){#toppy-sc .thc-main{grid-template-columns:minmax(0,1fr)}}
#toppy-sc .thc-stage{margin:0;padding:22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){#toppy-sc .thc-stage{border-right:0;border-bottom:1px solid var(--line);padding:14px}}
#toppy-sc .thc-pic{position:relative;aspect-ratio:4/3;border-radius:var(--r2);overflow:hidden;background:var(--soft)}
#toppy-sc .thc-pic img{position:absolute;inset:0;width:100%;height:100%;display:block}
#toppy-sc .thc-fg{object-fit:contain}
#toppy-sc .thc-bg{object-fit:cover;filter:blur(22px) saturate(1.1);transform:scale(1.2);opacity:.85}
#toppy-sc .thc-pic.thc-tek{background:#fff}
/* kleurstaal of oproller: op wit, niet uitvergroot, geen wazige rand; houten zwembad vult het vlak */
#toppy-sc .thc-pic.thc-wit{background:#fff}
#toppy-sc .thc-pic.thc-wit .thc-fg{inset:14%;width:72%;height:72%}
#toppy-sc .thc-pic.thc-wit.thc-vol .thc-fg{inset:0;width:100%;height:100%}
#toppy-sc .thc-pic.thc-tek svg{position:absolute;inset:6%;width:88%;height:88%;display:block}
#toppy-sc .thc-thumb svg{width:100%;height:100%;display:block}
#toppy-sc .thc-vraag{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--soft);text-align:center;padding:16px}
#toppy-sc .thc-vraag span{display:flex;align-items:center;justify-content:center;width:min(34%,170px);aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:clamp(48px,9vw,96px);font-weight:700;line-height:1}
#toppy-sc .thc-vraag p{margin:0;font-size:15px;font-weight:600;color:var(--ink2)}
#toppy-sc .thc-pic figcaption{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#toppy-sc .thc-gekozen{display:none;position:absolute;left:0;right:0;bottom:0;flex-wrap:wrap;gap:4px 6px;padding:8px 10px}
#toppy-sc .thc-gekozen span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;line-height:1.3;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toppy-sc .thc-gekozen i{font-style:normal;font-weight:500;color:var(--ink2);margin-right:4px}
#toppy-sc .thc-gekozen i::after{content:":"}
#toppy-sc .thc-uitleg{background:var(--soft);border-radius:var(--r);padding:12px 16px}
#toppy-sc .thc-uitleg b{display:block;font-size:15px}
#toppy-sc .thc-uitleg p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
#toppy-sc .thc-usp{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2);margin:0;padding:0;list-style:none}
#toppy-sc .thc-usp li::before{content:"\2713";color:var(--g);font-weight:800;margin-right:6px}
#toppy-sc .thc-pnoot{margin:8px 0 12px;font-size:13px;color:var(--ink2)}
#toppy-sc .thc-gerust{margin-top:4px;font-size:14px;color:var(--ink)}

#toppy-sc .thc-panel{padding:24px 24px 28px;min-width:0}
@media (max-width:900px){#toppy-sc .thc-panel{padding:18px 14px 24px}}
#toppy-sc .thc-panel h2{font-family:var(--head);font-size:26px;font-weight:800;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
#toppy-sc .thc-lead{color:var(--ink2);margin:0 0 20px;font-size:15px;max-width:52ch}
#toppy-sc .thc-q{border:0;margin:0 0 22px;padding:0;min-width:0}
#toppy-sc .thc-q legend{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 8px;padding:0}

/* keuzerijen */
#toppy-sc .thc-list{display:grid;gap:8px}
#toppy-sc .thc-row{display:grid;grid-template-columns:64px minmax(0,1fr) 24px;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
#toppy-sc .thc-row:hover{box-shadow:var(--sh)}
#toppy-sc .thc-row[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fff8dc}
#toppy-sc .thc-thumb{width:64px;height:48px;border-radius:4px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--mute)}
#toppy-sc .thc-thumb img{width:100%;height:100%;object-fit:contain;display:block}
#toppy-sc .thc-thumb.thc-foto img{object-fit:cover}
#toppy-sc .thc-row b{display:block;font-size:15px;line-height:1.3}
#toppy-sc .thc-row small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink2);line-height:1.35;margin-top:1px}
#toppy-sc .thc-row .thc-rtxt{display:none}
#toppy-sc .thc-tag{display:inline-block;font-size:11px;font-weight:700;background:var(--y);color:var(--ink);border-radius:3px;padding:1px 7px;margin-left:6px;vertical-align:2px;line-height:1.5;white-space:nowrap}
#toppy-sc .thc-tag-groen{background:var(--g);color:#fff}
#toppy-sc .thc-tag-donker{background:var(--ink);color:#fff}
#toppy-sc .thc-clab{position:absolute;top:8px;left:8px;margin:0;font-size:12px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#toppy-sc .thc-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
#toppy-sc .thc-row[aria-pressed="true"] .thc-dot{background:var(--y);border-color:var(--y)}
#toppy-sc .thc-row[aria-pressed="true"] .thc-dot::after{content:"\2713";font-size:13px;font-weight:800;color:var(--ink)}
#toppy-sc .thc-row.thc-adv{border-style:dashed}
#toppy-sc .thc-row:focus-visible,#toppy-sc .thc-card:focus-visible,#toppy-sc .thc-btn:focus-visible,#toppy-sc .thc-step:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* uitvoeringskaarten */
#toppy-sc .thc-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#toppy-sc .thc-card{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;display:grid;grid-template-columns:38% minmax(0,1fr);transition:box-shadow .15s}
#toppy-sc .thc-card:hover{box-shadow:var(--sh)}
#toppy-sc .thc-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fff8dc}
#toppy-sc .thc-card[aria-pressed="true"]::after{content:"\2713";position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:800;font-size:13px}
#toppy-sc .thc-card .thc-cimg{position:relative;display:block;min-height:110px;background:var(--soft);overflow:hidden}
#toppy-sc .thc-card .thc-cimg img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#toppy-sc .thc-card .thc-cb{padding:10px 40px 12px 14px}
#toppy-sc .thc-card b{display:block;font-size:16px;line-height:1.3}
#toppy-sc .thc-card small{display:block;font-size:13px;color:var(--ink2);line-height:1.4;margin-top:2px}
#toppy-sc .thc-card .thc-p{display:block;font-family:var(--head);font-weight:800;font-size:17px;margin-top:6px}
#toppy-sc .thc-card .thc-p i{font-style:normal;font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;color:var(--ink2);margin-right:5px}
#toppy-sc .thc-card .thc-p em{font-style:normal;font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;color:var(--ink2);margin-left:3px}

/* maten */
#toppy-sc .thc-maten{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
#toppy-sc .thc-hint{font-size:13px;color:var(--ink2);margin:0 0 10px}
#toppy-sc .thc-calc{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;background:var(--soft);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:4px}
#toppy-sc .thc-calc b{font-family:var(--head);font-size:18px;font-weight:800}
#toppy-sc .thc-calc small{flex-basis:100%;color:var(--ink2);font-size:12px}
#toppy-sc .thc-tip{background:#fff8dc;border:1px solid var(--y);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:10px}

/* overzicht + formulier */
#toppy-sc .thc-sum{display:grid;gap:8px;margin:0 0 12px;font-size:14px}
#toppy-sc .thc-sum section{background:var(--soft);border-radius:var(--r);padding:10px 14px 8px}
#toppy-sc .thc-sum header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
#toppy-sc .thc-sum h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
#toppy-sc .thc-sum button{border:0;background:none;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;padding:0}
#toppy-sc .thc-sum dl{margin:0}
#toppy-sc .thc-sum dl div{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px;padding:2px 0}
#toppy-sc .thc-sum dt{color:var(--ink2)}
#toppy-sc .thc-sum dd{margin:0;font-weight:600}
#toppy-sc .thc-kop{font-family:var(--head);font-size:18px;font-weight:800;margin:22px 0 10px}
#toppy-sc .thc-kop1{margin-top:4px}
#toppy-sc .thc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){#toppy-sc .thc-two{grid-template-columns:1fr}}
#toppy-sc .thc-field{display:grid;gap:4px;margin-bottom:12px}
#toppy-sc .thc-field label{font-weight:600;font-size:14px}
#toppy-sc .thc-field label small{font-weight:400;color:var(--mute)}
#toppy-sc .thc-field input,#toppy-sc .thc-field textarea{font-size:16px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;background:#fff}
#toppy-sc .thc-field input:focus,#toppy-sc .thc-field textarea:focus{outline:none;border-color:var(--ink)}
#toppy-sc .thc-err{color:var(--red);font-size:13px}

/* voetbalk */
#toppy-sc .thc-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r2) var(--r2);padding:12px 22px;box-shadow:0 -6px 16px -10px rgba(0,0,0,.18)}
@media (max-width:900px){#toppy-sc .thc-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}}
#toppy-sc .thc-keuze{min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#toppy-sc .thc-keuze b{color:var(--ink)}
#toppy-sc .thc-prijs{text-align:right;font-size:12px;color:var(--ink2);line-height:1.15;white-space:nowrap}
#toppy-sc .thc-prijs b{display:block;font-family:var(--head);font-size:19px;font-weight:800;color:var(--ink)}
@media (max-width:600px){#toppy-sc .thc-keuze{display:none}#toppy-sc .thc-wat{display:none}}
#toppy-sc .thc-btn{border:0;border-radius:var(--r);padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
#toppy-sc .thc-back{background:#fff;border:1px solid var(--line)}
#toppy-sc .thc-go{background:var(--y);margin-left:auto}
#toppy-sc .thc-prijs+.thc-go{margin-left:0}
#toppy-sc .thc-go:hover{background:var(--y2)}
#toppy-sc .thc-go[disabled]{opacity:.6;cursor:wait}
@media (max-width:600px){#toppy-sc .thc-go{flex:1;min-width:0;white-space:normal;line-height:1.25}#toppy-sc .thc-btn{padding:12px 14px}}

/* bedankt */
#toppy-sc .thc-done{border:1px solid var(--line);border-radius:var(--r2);padding:32px 24px;background:#fff}
#toppy-sc .thc-done:focus{outline:none}
#toppy-sc .thc-done h2{font-family:var(--head);font-weight:800;font-size:28px;margin:0 0 8px}
#toppy-sc .thc-vink{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin-bottom:14px}
#toppy-sc .thc-next{margin:14px 0 4px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:n}
#toppy-sc .thc-next li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:15px;counter-increment:n}
#toppy-sc .thc-next li::before{content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:700;font-size:13px}
#toppy-sc .thc-done>.thc-btn{margin-top:18px}
@media (max-width:600px){#toppy-sc .thc-done{padding:22px 16px}#toppy-sc .thc-done h2{font-size:22px}}
#toppy-sc .thc-x{border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
#toppy-sc .thc-x:hover{background:var(--line)}
@media (max-width:600px){
  #toppy-sc .thc-bar{padding:10px 14px;gap:10px}
  #toppy-sc .thc-bar h1{font-size:16px}
  #toppy-sc .thc-bar .thc-vanaf b{font-size:17px}
  #toppy-sc .thc-steps{overflow:visible}
  #toppy-sc .thc-step{flex:1 1 auto;justify-content:center;padding:10px 4px;font-size:13px;gap:6px}
  #toppy-sc .thc-step:not(.is-now) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #toppy-sc .thc-step.is-now{flex:2 1 auto}
  #toppy-sc .thc-panel h2{font-size:21px}
  #toppy-sc .thc-lead{font-size:14px;margin-bottom:14px}
  #toppy-sc .thc-card .thc-cb{padding:10px 36px 10px 12px}
  #toppy-sc .thc-card small{font-size:12px}
}
/* losse pagina (iframe in een modal): vult het kader; alleen het middenstuk scrolt */
#toppy-sc.thc-app{height:100vh;height:100dvh;max-width:none;display:flex;flex-direction:column;overflow:hidden}
#toppy-sc.thc-app>*{flex:none}
#toppy-sc.thc-app .thc-test{margin:0;border-radius:0;border-width:0 0 1px;padding:4px 14px;font-size:12px}
#toppy-sc.thc-app .thc-foot{border-radius:0}
#toppy-sc.thc-app .thc-steps,#toppy-sc.thc-app .thc-main,#toppy-sc.thc-app .thc-foot{border-left:0;border-right:0}
#toppy-sc.thc-app .thc-main{flex:1 1 auto;min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr)}
#toppy-sc.thc-app .thc-stage,#toppy-sc.thc-app .thc-panel{overflow:auto;overscroll-behavior:contain}
#toppy-sc.thc-app .thc-foot{position:static}
#toppy-sc.thc-app .thc-steps{align-items:center}
#toppy-sc.thc-app .thc-steps .thc-x{margin:0 10px 0 4px;width:32px;height:32px;font-size:20px}
#toppy-sc.thc-app .thc-done{flex:1 1 auto;min-height:0;overflow:auto;border:0;border-radius:0}
@media (max-width:900px){
  #toppy-sc.thc-app .thc-main{display:block;overflow:auto;overscroll-behavior:contain}
  #toppy-sc.thc-app .thc-stage,#toppy-sc.thc-app .thc-panel{overflow:visible}
  #toppy-sc.thc-app .thc-stage{display:contents}
  #toppy-sc.thc-app .thc-pic{position:sticky;top:0;z-index:3;aspect-ratio:auto;height:min(52vw,28vh);border-radius:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #toppy-sc.thc-app .thc-pic figcaption{display:none}
  #toppy-sc.thc-app .thc-vraag p{display:none}
  #toppy-sc.thc-app .thc-vraag span{width:auto;height:72%;font-size:clamp(40px,12vw,64px)}
  #toppy-sc.thc-app .thc-gekozen{display:flex}
  #toppy-sc.thc-app .thc-uitleg{display:none}
  #toppy-sc.thc-app .thc-stage .thc-usp{margin:12px 14px 0}
  #toppy-sc.thc-app .thc-panel{border-top:1px solid var(--line);margin-top:14px}
