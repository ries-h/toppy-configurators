<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stel je lamellendek samen · Toppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://cdn.toppy.nl/frontend/typpo/typpo-heavy.css">
<style>html,body{margin:0;background:#fff;font-family:Poppins,Helvetica,Arial,system-ui,sans-serif;-webkit-text-size-adjust:100%}</style>
</head><body>
<!-- ============================================================
     Toppy configurator lamellendek (2026-10-27)
     Vervangt het JotForm "Aanvraag formulier lamellen" (223043516146347) als invulscherm.
     Aanvragen gaan naar JotForm 262993449548375 (Offerte aanvragen lamellendek, 2026-10-27):
     elk gegeven in een eigen verborgen veld, zodat het Freshdesk-ticket per vraag een label toont.
     Stappen: situatie (nieuw of vervangen), lamellen, kleur, zwembad, oprollen (alleen nieuw),
     installatie, overzicht + gegevens.
     Prijsindicatie: lengte x breedte (binnenmaat, lengte incl. trap) x vanaf-prijs per m² van de
     gekozen kleur, plus de vanaf-prijs van oproller, installatie en extra's.
     Handmatig aanpassen kan alleen in het blok "INSTELLINGEN".
     ============================================================ -->
<div id="toppy-lc" data-pagina></div>
<style>
#toppy-lc{--ink:#343e40;--ink2:#5f6768;--mute:#8b9091;--line:#e6e6e6;--soft:#f5f5f3;--soft2:#fafaf8;--y:#ffcb01;--y2:#fdd941;--ysoft:#fff8dc;--g:#12ac74;--blue:#35acf8;--red:#f3575e;
  --head:Typpo,Poppins,Helvetica,Arial,system-ui,sans-serif;--r:.5rem;--r2:.875rem;--sh:0 8px 20px -6px rgba(0,0,0,.16);
  color:var(--ink);font-family:inherit;line-height:1.5;max-width:1120px;margin:0 auto;position:relative}
#toppy-lc *{box-sizing:border-box}
#toppy-lc button,#toppy-lc input,#toppy-lc textarea,#toppy-lc select{font-family:inherit;color:inherit}
#toppy-lc a{color:var(--blue)}
#toppy-lc .thc-test{background:#fff8d6;border:1px solid var(--y);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:10px}

/* stappen */
#toppy-lc .thc-steps{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r2) var(--r2) 0 0;background:#fff;overflow-x:auto;scrollbar-width:none;padding:0 8px}
#toppy-lc .thc-steps::-webkit-scrollbar{display:none}
#toppy-lc .thc-step{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 12px 13px;border:0;background:none;font-size:14px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
#toppy-lc .thc-step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink2)}
#toppy-lc .thc-step.is-done{color:var(--ink)}
#toppy-lc .thc-step.is-done i{background:var(--g);color:#fff}
#toppy-lc .thc-step.is-now{color:var(--ink);font-weight:700;border-bottom-color:var(--y)}
#toppy-lc .thc-step.is-now i{background:var(--y);color:var(--ink)}
#toppy-lc .thc-step[disabled]{cursor:default}

/* hoofdvlak */
#toppy-lc .thc-main{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);border:1px solid var(--line);border-top:0;background:#fff}
@media (max-width:900px){#toppy-lc .thc-main{grid-template-columns:minmax(0,1fr)}}
#toppy-lc .thc-stage{margin:0;padding:28px;background:var(--soft2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){#toppy-lc .thc-stage{border-right:0;border-bottom:1px solid var(--line);padding:16px}}
#toppy-lc .thc-pic{position:relative;aspect-ratio:4/3;border-radius:var(--r2);overflow:hidden;background:var(--soft);box-shadow:0 1px 0 var(--line)}
#toppy-lc .thc-pic img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#toppy-lc .thc-pic.thc-wit,#toppy-lc .thc-pic.thc-tek{background:#fff}
#toppy-lc .thc-pic.thc-wit img{inset:6%;width:88%;height:88%;object-fit:contain}
#toppy-lc .thc-pic.thc-tek svg{position:absolute;inset:7%;width:86%;height:86%;display:block}
#toppy-lc .thc-vraag{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--soft);text-align:center;padding:20px}
#toppy-lc .thc-vraag span{display:flex;align-items:center;justify-content:center;width:min(30%,150px);aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:clamp(44px,8vw,84px);font-weight:700;line-height:1}
#toppy-lc .thc-vraag p{margin:0;font-size:15px;font-weight:600;color:var(--ink2);max-width:34ch}
#toppy-lc .thc-pic figcaption{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#toppy-lc .thc-gekozen{display:none;position:absolute;left:0;right:0;bottom:0;flex-wrap:wrap;gap:4px 6px;padding:8px 10px}
#toppy-lc .thc-gekozen span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;line-height:1.3;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toppy-lc .thc-gekozen i{font-style:normal;font-weight:500;color:var(--ink2);margin-right:4px}
#toppy-lc .thc-gekozen i::after{content:":"}
#toppy-lc .thc-uitleg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
#toppy-lc .thc-uitleg b{display:block;font-size:15px}
#toppy-lc .thc-uitleg p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
#toppy-lc .thc-usp{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--ink2);margin:0;padding:0;list-style:none}
#toppy-lc .thc-usp li::before{content:"\2713";color:var(--g);font-weight:800;margin-right:6px}
/* vergelijking in het podium (stap lamellen) */
#toppy-lc .thc-verg{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px}
#toppy-lc .thc-verg table{width:100%;border-collapse:collapse}
#toppy-lc .thc-verg th,#toppy-lc .thc-verg td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
#toppy-lc .thc-verg tr:last-child td{border-bottom:0}
#toppy-lc .thc-verg thead th{font-weight:700;font-size:12px;color:var(--ink2);background:var(--soft2)}
#toppy-lc .thc-verg td:first-child{color:var(--ink2);white-space:nowrap}
#toppy-lc .thc-verg .is-aan{background:var(--ysoft);font-weight:700;color:var(--ink)}

#toppy-lc .thc-panel{padding:32px 34px 36px;min-width:0}
@media (max-width:900px){#toppy-lc .thc-panel{padding:22px 16px 28px}}
#toppy-lc .thc-panel h2{font-family:var(--head);font-size:28px;font-weight:800;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
#toppy-lc .thc-lead{color:var(--ink2);margin:0 0 26px;font-size:15px;max-width:52ch}
#toppy-lc .thc-q{border:0;margin:0 0 26px;padding:0;min-width:0}
#toppy-lc .thc-q:last-child{margin-bottom:0}
#toppy-lc .thc-q legend{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:0 0 10px;padding:0}
#toppy-lc .thc-q legend small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute);margin-left:6px;font-size:12px}

/* keuzerijen */
#toppy-lc .thc-list{display:grid;gap:10px}
#toppy-lc .thc-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto 24px;align-items:center;gap:16px;width:100%;min-height:72px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 16px 10px 10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
#toppy-lc .thc-row.thc-zonder{grid-template-columns:minmax(0,1fr) auto 24px;padding-left:16px}
#toppy-lc .thc-row:hover{box-shadow:var(--sh)}
#toppy-lc .thc-row[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ysoft)}
#toppy-lc .thc-thumb{width:76px;height:54px;border-radius:6px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--mute)}
#toppy-lc .thc-thumb img{width:100%;height:100%;object-fit:contain;display:block}
#toppy-lc .thc-thumb.thc-foto img{object-fit:cover}
#toppy-lc .thc-thumb svg{width:100%;height:100%;display:block}
#toppy-lc .thc-row b{display:block;font-size:15px;line-height:1.3}
#toppy-lc .thc-row small{display:block;font-size:13px;color:var(--ink2);line-height:1.4;margin-top:2px}
#toppy-lc .thc-rp{font-family:var(--head);font-weight:800;font-size:15px;white-space:nowrap;text-align:right;line-height:1.15}
#toppy-lc .thc-rp i{display:block;font-style:normal;font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:400;font-size:11px;color:var(--ink2)}
#toppy-lc .thc-tag{display:inline-block;font-size:11px;font-weight:700;background:var(--y);color:var(--ink);border-radius:3px;padding:1px 7px;margin-left:6px;vertical-align:2px;line-height:1.5;white-space:nowrap}
#toppy-lc .thc-tag-groen{background:var(--g);color:#fff}
#toppy-lc .thc-tag-donker{background:var(--ink);color:#fff}
#toppy-lc .thc-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:#fff}
#toppy-lc .thc-row.thc-check .thc-dot{border-radius:5px}
#toppy-lc .thc-row[aria-pressed="true"] .thc-dot{background:var(--y);border-color:var(--y)}
#toppy-lc .thc-row[aria-pressed="true"] .thc-dot::after{content:"\2713";font-size:13px;font-weight:800;color:var(--ink)}
#toppy-lc .thc-row.thc-adv{border-style:dashed}
#toppy-lc .thc-row:focus-visible,#toppy-lc .thc-card:focus-visible,#toppy-lc .thc-btn:focus-visible,#toppy-lc .thc-step:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* grote kaarten (situatie, lamellen) */
#toppy-lc .thc-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#toppy-lc .thc-card{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;display:grid;grid-template-columns:36% minmax(0,1fr);transition:box-shadow .15s}
#toppy-lc .thc-card:hover{box-shadow:var(--sh)}
#toppy-lc .thc-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ysoft)}
#toppy-lc .thc-card[aria-pressed="true"]::after{content:"\2713";position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:800;font-size:13px}
#toppy-lc .thc-cimg{position:relative;display:block;min-height:124px;background:var(--soft);overflow:hidden}
#toppy-lc .thc-cimg img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#toppy-lc .thc-cimg .thc-tag{position:absolute;top:8px;left:8px;margin:0;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#toppy-lc .thc-cb{padding:14px 44px 14px 16px}
#toppy-lc .thc-card b{display:block;font-size:16px;line-height:1.3}
#toppy-lc .thc-card small{display:block;font-size:13px;color:var(--ink2);line-height:1.45;margin-top:3px}
#toppy-lc .thc-card .thc-p{display:block;font-family:var(--head);font-weight:800;font-size:17px;margin-top:8px}
#toppy-lc .thc-card .thc-p i{font-style:normal;font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;color:var(--ink2);margin-right:5px}
#toppy-lc .thc-card .thc-p em{font-style:normal;font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;color:var(--ink2);margin-left:3px}
#toppy-lc .thc-feit{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}
#toppy-lc .thc-feit li::before{content:"\2713";color:var(--g);font-weight:800;margin-right:5px}

/* maten */
#toppy-lc .thc-maten{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
#toppy-lc .thc-hint{font-size:13px;color:var(--ink2);margin:0 0 12px}
#toppy-lc .thc-calc{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;background:var(--soft);border-radius:var(--r);padding:12px 16px;font-size:14px}
#toppy-lc .thc-calc b{font-family:var(--head);font-size:18px;font-weight:800}
#toppy-lc .thc-calc small{flex-basis:100%;color:var(--ink2);font-size:12px}
#toppy-lc .thc-tip{background:var(--ysoft);border:1px solid var(--y);border-radius:var(--r);padding:12px 16px;font-size:14px;margin-top:12px}

/* overzicht + formulier */
#toppy-lc .thc-sum{display:grid;gap:10px;margin:0 0 12px;font-size:14px}
#toppy-lc .thc-sum section{background:var(--soft);border-radius:var(--r);padding:12px 16px 10px}
#toppy-lc .thc-sum header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#toppy-lc .thc-sum h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
#toppy-lc .thc-sum button{border:0;background:none;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;padding:0}
#toppy-lc .thc-sum dl{margin:0}
#toppy-lc .thc-sum dl div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:3px 0}
#toppy-lc .thc-sum dt{color:var(--ink2)}
#toppy-lc .thc-sum dd{margin:0;font-weight:600}
@media (max-width:420px){#toppy-lc .thc-sum dl div{grid-template-columns:minmax(0,1fr)}#toppy-lc .thc-sum dl div{gap:0;padding:4px 0}}
#toppy-lc .thc-pnoot{margin:8px 0 12px;font-size:13px;color:var(--ink2)}
#toppy-lc .thc-kop{font-family:var(--head);font-size:18px;font-weight:800;margin:28px 0 12px}
#toppy-lc .thc-kop1{margin-top:0}
#toppy-lc .thc-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toppy-lc .thc-two.thc-adres{grid-template-columns:2fr 1fr}
@media (max-width:520px){#toppy-lc .thc-two,#toppy-lc .thc-two.thc-adres{grid-template-columns:1fr;gap:0}}
#toppy-lc .thc-field{display:grid;gap:5px;margin-bottom:14px}
#toppy-lc .thc-field label{font-weight:600;font-size:14px}
#toppy-lc .thc-field label small{font-weight:400;color:var(--mute)}
#toppy-lc .thc-field input,#toppy-lc .thc-field textarea,#toppy-lc .thc-field select{font-size:16px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;width:100%;background:#fff}
#toppy-lc .thc-field input:focus,#toppy-lc .thc-field textarea:focus,#toppy-lc .thc-field select:focus{outline:none;border-color:var(--ink)}
#toppy-lc .thc-err{color:var(--red);font-size:13px}
#toppy-lc .thc-gerust{margin-top:6px;font-size:14px;color:var(--ink)}

/* voetbalk */
#toppy-lc .thc-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r2) var(--r2);padding:14px 24px;box-shadow:0 -6px 16px -10px rgba(0,0,0,.18)}
@media (max-width:900px){#toppy-lc .thc-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}}
#toppy-lc .thc-keuze{min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#toppy-lc .thc-keuze b{color:var(--ink)}
#toppy-lc .thc-prijs{text-align:right;font-size:12px;color:var(--ink2);line-height:1.15;white-space:nowrap}
#toppy-lc .thc-prijs b{display:block;font-family:var(--head);font-size:20px;font-weight:800;color:var(--ink)}
@media (max-width:600px){#toppy-lc .thc-keuze{display:none}#toppy-lc .thc-wat{display:none}}
#toppy-lc .thc-btn{border:0;border-radius:var(--r);padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
#toppy-lc .thc-back{background:#fff;border:1px solid var(--line)}
#toppy-lc .thc-go{background:var(--y);margin-left:auto}
#toppy-lc .thc-prijs+.thc-go{margin-left:0}
#toppy-lc .thc-go:hover{background:var(--y2)}
#toppy-lc .thc-go[disabled]{opacity:.6;cursor:wait}
@media (max-width:600px){#toppy-lc .thc-go{flex:1;min-width:0;white-space:normal;line-height:1.25}#toppy-lc .thc-btn{padding:12px 14px}}

/* bedankt */
#toppy-lc .thc-done{border:1px solid var(--line);border-radius:var(--r2);padding:40px 36px;background:#fff}
#toppy-lc .thc-done:focus{outline:none}
#toppy-lc .thc-done-in{max-width:620px;margin:0 auto}
#toppy-lc .thc-done h2{font-family:var(--head);font-weight:800;font-size:28px;margin:0 0 10px}
#toppy-lc .thc-vink{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin-bottom:16px}
#toppy-lc .thc-next{margin:16px 0 4px;padding:0;list-style:none;display:grid;gap:12px;counter-reset:n}
#toppy-lc .thc-next li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;font-size:15px;counter-increment:n}
#toppy-lc .thc-next li::before{content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:700;font-size:13px}
#toppy-lc .thc-done .thc-btn{margin-top:20px}
@media (max-width:600px){#toppy-lc .thc-done{padding:24px 16px}#toppy-lc .thc-done h2{font-size:22px}}
#toppy-lc .thc-x{border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
#toppy-lc .thc-x:hover{background:var(--line)}
@media (max-width:600px){
  #toppy-lc .thc-steps{overflow:visible;padding:0 4px}
  #toppy-lc .thc-step{flex:1 1 auto;padding:11px 3px 9px;font-size:13px;gap:6px}
  #toppy-lc .thc-step:not(.is-now) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #toppy-lc .thc-step.is-now{flex:2 1 auto}
  #toppy-lc .thc-step i{width:22px;height:22px}
  #toppy-lc .thc-panel h2{font-size:22px}
  #toppy-lc .thc-lead{font-size:14px;margin-bottom:18px}
  #toppy-lc .thc-card{grid-template-columns:34% minmax(0,1fr)}
  #toppy-lc .thc-cb{padding:12px 38px 12px 12px}
  #toppy-lc .thc-card small{font-size:12.5px}
  #toppy-lc .thc-row{grid-template-columns:60px minmax(0,1fr) auto 22px;gap:12px;padding:8px 12px 8px 8px}
  #toppy-lc .thc-row.thc-zonder{grid-template-columns:minmax(0,1fr) auto 22px;padding-left:14px}
  #toppy-lc .thc-thumb{width:60px;height:46px}
}
/* losse pagina (iframe in een modal): vult het kader; alleen het middenstuk scrolt */
#toppy-lc.thc-app{height:100vh;height:100dvh;max-width:none;display:flex;flex-direction:column;overflow:hidden}
#toppy-lc.thc-app>*{flex:none}
#toppy-lc.thc-app .thc-test{margin:0;border-radius:0;border-width:0 0 1px;padding:4px 14px;font-size:12px}
#toppy-lc.thc-app .thc-steps{border-radius:0;border-left:0;border-right:0;border-top:0}
#toppy-lc.thc-app .thc-main,#toppy-lc.thc-app .thc-foot{border-left:0;border-right:0;border-radius:0}
#toppy-lc.thc-app .thc-main{flex:1 1 auto;min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr)}
#toppy-lc.thc-app .thc-stage,#toppy-lc.thc-app .thc-panel{overflow:auto;overscroll-behavior:contain}
#toppy-lc.thc-app .thc-foot{position:static}

/* ---------- vormtekeningen (bovenaanzicht met lamellen en maatlijnen L/B) ---------- */
var SVGN=0;
function vormSvg(v, maten){
  // basin = rechthoek 100..340 x 70..200; trap op korte zijde links, op lange zijde onder
  var sh={
    'Geen trap':{d:'M80 70H340V200H80Z',L:[80,340],B:[70,200]},
    'Romeinse trap':{d:'M120 70H340V200H120V175A40 40 0 0 1 120 95Z',L:[80,340],B:[70,200]},

  g+='<path d="'+sh.d+'" fill="#7fb7d8"/><g clip-path="url(#'+id+')">';
  // lamellen: banen over de breedte, oprollen in de lengte
  var x0=v.indexOf('lange')<0&&v!=='Geen trap'?120:80;

  g+='</g><path d="'+sh.d+'" fill="none" stroke="#2f5670" stroke-width="3"/>';
  if(maten){
    var my=sh.B[1]+28, mx=362;
    [['L',sh.L[0],sh.L[1],my,true],['B',sh.B[0],sh.B[1],mx,false]].forEach(function(q){
      var L=q[0], a=q[1], b=q[2], c=q[3], hor=q[4], mid=(a+b)/2;
      if(L==='L'&&v.indexOf('lange zijde')>0) c=sh.B[1]+(v.indexOf('Romeinse')===0?60:52);
      var ln=hor?'M'+a+' '+c+'H'+b+'M'+a+' '+(c-7)+'V'+(c+7)+'M'+b+' '+(c-7)+'V'+(c+7):'M'+c+' '+a+'V'+b+'M'+(c-7)+' '+a+'H'+(c+7)+'M'+(c-7)+' '+b+'H'+(c+7);
      var cx=hor?mid:c, cy=hor?c:mid;
      g+='<path d="'+ln+'" stroke="#343e40" stroke-width="2" fill="none"/><circle cx="'+cx+'" cy="'+cy+'" r="13" fill="#ffcb01" stroke="#343e40" stroke-width="2"/>'+
         '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="14" font-weight="700" fill="#343e40">'+L+'</text>';
    });
  }
  return '<svg viewBox="0 0 400 290" role="img" aria-label="Tekening '+e(v)+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';

// rij: k = veld in S, v = waarde; opt: naam, sub, prijs [bedrag, onderschrift], beeld, svg, foto, check, adv

function podium(){

  var g=ev.target.closest('[data-ga]'); if(g&&!g.disabled) return ga(+g.getAttribute('data-ga'));
  var a=ev.target.closest('[data-a]'); if(!a) return;
  if(a.getAttribute('data-a')==='sluiten') return sluit();
  if(a.getAttribute('data-a')==='terug') return ga(stap-1);
  lees();
  var id=stapId();
  if(id==='situatie'&&!nieuw()&&!S.merk){ fout={merk:'Kies het merk van je huidige lamellen (of "Anders/Weet ik niet").'}; return render(); }
  if(id==='zwembad'&&!maatOk()){ fout={maat:'Vul lengte en breedte in hele centimeters in (minimaal 100 cm), dan rekenen we de oppervlakte uit.'}; return render(); }
  if(!stappen()[stap].contact) return ga(stap+1);
  fout={};
  if(!S.voornaam) fout.voornaam='Vul je voornaam in.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email)) fout.email='Vul een geldig e-mailadres in, dan kunnen we je voorstel sturen.';
  if(Object.keys(fout).length) return render();
  verstuur();
});

root.addEventListener('input',function(ev){ if(ev.target.getAttribute('data-maat')){ lees(); render(); } });
root.addEventListener('change',function(ev){ if(ev.target.tagName==='SELECT') lees(); });
if(APP) document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') sluit(); });
if(APP&&!IFRAME) document.addEventListener('click',function(ev){ if(ev.target===document.body||ev.target===document.documentElement) sluit(); });
render(); meld('geladen');
})();
